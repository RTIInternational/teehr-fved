apiVersion: garden.io/v2
kind: Project
name: teehr-hub
defaultEnvironment: local

variables:
  smtp:
    host: smtp.gmail.com
    port: "587"
    fromDisplayName: FVED
    replyToDisplayName: FVED Support
    starttls: "true"
    ssl: "false"
  aws:
    region: us-east-1
  remoteCluster:
    contextArn: arn:aws:eks:us-east-1:794457362858:cluster/fved-cluster
    ecrRegistry: 794457362858.dkr.ecr.us-east-1.amazonaws.com

environments:
  - name: local
    defaultNamespace: ${project.name}
    variables:
      hostname: teehr.local.app.garden
      certificateIssuerName: letsencrypt-prod
      devTeehrVersion: 45920e23ad29b1ea354e3d0d4b68cbf58787cf4a
      stableTeehrVersion: place-holder # Needed for sync to work for some reason.
      previousTeehrVersion: place-holder
      polaris:
        inCluster: "true"
        catalogS3PathStyleAccess: "true"
        catalogS3Endpoint: "http://minio:9000"
        catalogS3Region: ${var.aws.region}
        catalogType: rest
        catalogUri: http://polaris:8181/api/catalog
        catalogWarehouse: s3://warehouse/
        catalogRoleArn: "" # MinIO has no real STS; Polaris can't assume a role against it
        skipCredentialSubscopingIndirection: "true"
        storageStsUnavailable: "true"
        defaultRealm: teehr
        realmsCsv: teehr
        oauthServerUri: http://keycloak-service:8080/realms/teehr/protocol/openid-connect/token
        oidcIssuerUri: http://keycloak-service:8080/realms/teehr
      trino:
        host: trino
        port: "8080"
        user: teehr
        catalog: iceberg
        schema: teehr
      allowedOrigins: "https://dashboards.${var.hostname},https://api.${var.hostname}"
      icechunk:
        bucket: "warehouse"
        prefix: "icechunk-ingests"
        repos: "ua-swann-4km,snodas-4km,cu-swe-4km"
  - name: remote
    defaultNamespace: ${project.name}
    variables:
      hostname: dev.low.amzifved.aws.rti.org
      certificateIssuerName: letsencrypt-prod
      devTeehrVersion: 45920e23ad29b1ea354e3d0d4b68cbf58787cf4a
      stableTeehrVersion: v0.6.5
      previousTeehrVersion: v0.5.3
      irsa:
        # icebergRestRoleArn: arn:aws:iam::794457362858:role/fved-iceberg-s3-warehouse-irsa
        jupyterRoleArn: arn:aws:iam::794457362858:role/fved-iceberg-s3-warehouse-readonly-irsa
        # prefectJobRoleArn: arn:aws:iam::794457362858:role/fved-prefect-jobs-irsa
        # sparkRoleArn: arn:aws:iam::794457362858:role/fved-iceberg-s3-warehouse-readonly-irsa
        # trinoRoleArn: arn:aws:iam::794457362858:role/fved-iceberg-s3-warehouse-irsa
        xpublishRoleArn: arn:aws:iam::794457362858:role/fved-iceberg-s3-warehouse-readonly-irsa
        # Polaris's own identity, used to assume the warehouse data-access
        # role and vend scoped, short-lived S3 credentials to Trino, Spark,
        # Prefect, and Jupyter. No other service holds a warehouse role.
        polarisRoleArn: arn:aws:iam::794457362858:role/fved-polaris-irsa
      polaris:
        inCluster: "true"
        catalogS3PathStyleAccess: "false"
        catalogS3Endpoint: ""
        catalogS3Region: ${var.aws.region}
        catalogType: rest
        catalogUri: http://polaris:8181/api/catalog
        catalogWarehouse: s3://dev-fved-iceberg-warehouse-rti-use1/
        catalogRoleArn: arn:aws:iam::794457362858:role/fved-iceberg-s3-warehouse-irsa
        skipCredentialSubscopingIndirection: "false"
        storageStsUnavailable: "false"
        defaultRealm: teehr
        realmsCsv: teehr
        oauthServerUri: http://keycloak-service:8080/realms/teehr/protocol/openid-connect/token
        oidcIssuerUri: http://keycloak-service:8080/realms/teehr
      nfsServerDns: "fs-0d53828f401595456.efs.us-east-1.amazonaws.com"
      trino:
        host: trino
        port: "8080"
        user: teehr
        catalog: iceberg
        schema: teehr
      allowedOrigins: "https://dashboards.${var.hostname},https://api.${var.hostname}"
      icechunk:
        bucket: "dev-fved-icechunk-warehouse-rti-use1"
        prefix: "icechunk-ingests"
        repos: "ua-swann-4km,snodas-4km,cu-swe-4km"
providers:
  # The name of the provider plugin to use.
  - name: local-kubernetes
    namespace: ${environment.namespace}
    environments: ["local"]
    setupIngressController: false
    deploymentRegistry:
      hostname: localhost:5001
      namespace: ${project.name}
    context: kind-kind
  - name: kubernetes
    namespace: ${environment.namespace}
    environments: ["remote"]
    imagePullSecrets:
      - name: ecr-config
        namespace: ecr-secrets
    deploymentRegistry:
      hostname: ${var.remoteCluster.ecrRegistry}
      namespace: ${project.name}
    context: ${var.remoteCluster.contextArn}
    buildMode: cluster-buildkit
    defaultHostname: dev.low.amzifved.aws.rti.org