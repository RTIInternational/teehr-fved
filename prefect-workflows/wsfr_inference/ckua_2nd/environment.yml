name: ckua_infer
# Same pins as the validated competition environment (vendor/ckua_mlp_2nd/environment.yml, env `water_forecast_final`),
# plus the competition downloader pinned to the commit used for all QC runs. Our own code needs only the standard library,
# pandas and requests; `patch` (GNU) must be on PATH for `build`.
channels:
  - pytorch
  - conda-forge
dependencies:
  - joblib=1.3.2
  - lightning=2.1.2
  - numpy=1.26.0
  - pandas=2.1.3
  - pip=23.3.1
  - python=3.10.13
  - pytorch=2.1.1=py3.10_cpu_0
  - pytorch-lightning=2.1.1
  - pytorch-mutex=1.0=cpu
  - scikit-learn=1.3.2
  - scipy=1.11.3
  - tqdm=4.66.1
  - tensorboard=2.16.2
  - setuptools<81  # lightning 2.1.x imports pkg_resources, removed in setuptools 82
  - requests
  - pytest
  - patch
  - pip:
      - pytorch-optimizer==2.12.0
      - wsfr_download@git+https://github.com/drivendataorg/water-supply-forecast-rodeo-runtime.git@6bda07bc8ef91682377d77021a20b30028072771#egg=pkg&subdirectory=data_download
