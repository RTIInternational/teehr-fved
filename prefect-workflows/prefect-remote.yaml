# Welcome to your prefect.yaml file! You can you this file for storing and managing
# configuration for deploying your flows. We recommend committing this file to source
# control along with your flow code.

# Generic metadata about this project
name: teehr-hub
prefect-version: 3.4.24

# build section allows you to manage and build docker images
build: null

# push section allows you to manage if and how this project is uploaded to remote locations
push: null

# pull section allows you to provide instructions for cloning this project in remote locations
pull: null

# the definitions section allows you to define reusable components for your deployments
definitions:
  temp_dir_path: &temp_dir_path "/data/temp-spark"
  log_level: &log_level INFO
  tags: &common_tags
    - k8s
  work_pool_job_variables_base: &work_pool_job_variables_base
    image: "{{ $PREFECT_TEEHR_IMAGE }}"
    image_pull_policy: Always
    namespace: "{{ $TEEHR_NAMESPACE }}"
    finished_job_ttl: 300
    job_watch_timeout_seconds: 900
    pod_watch_timeout_seconds: 300
    service_account_name: prefect-job
    env:
      PREFECT_LOGGING_LEVEL: *log_level
      TEEHR_SPARK_IMAGE: "{{ $TEEHR_SPARK_IMAGE }}"
      TEEHR_NAMESPACE: "{{ $TEEHR_NAMESPACE }}"
      PREFECT_LOGGING_EXTRA_LOGGERS: teehr
      # Concurrent chunk reads/writes per zarr call (default 10)
      ZARR_ASYNC__CONCURRENCY: "128"
      # Start Local Only
      # AWS_ACCESS_KEY_ID: "{{ $AWS_ACCESS_KEY_ID }}"
      # AWS_SECRET_ACCESS_KEY: "{{ $AWS_SECRET_ACCESS_KEY }}"
      # REMOTE_CATALOG_S3_ENDPOINT: "{{ $REMOTE_CATALOG_S3_ENDPOINT }}"
      # REMOTE_CATALOG_S3_PATH_STYLE_ACCESS: "{{ $REMOTE_CATALOG_S3_PATH_STYLE_ACCESS }}"
      # End Local Only
      AWS_REGION: "{{ $AWS_REGION }}"
      REMOTE_CATALOG_REST_URI: "{{ $REMOTE_CATALOG_REST_URI }}"
      REMOTE_CATALOG_TYPE: "{{ $REMOTE_CATALOG_TYPE }}"
      REMOTE_WAREHOUSE_IDENTIFIER: "{{ $REMOTE_WAREHOUSE_IDENTIFIER }}"
      POLARIS_OAUTH2_SERVER_URI: "{{ $POLARIS_OAUTH2_SERVER_URI }}"
      POLARIS_CLIENT_ID: "{{ $POLARIS_CLIENT_ID }}"
      POLARIS_CLIENT_SECRET: "{{ $POLARIS_CLIENT_SECRET }}"
      POLARIS_DEFAULT_REALM: "{{ $POLARIS_DEFAULT_REALM }}"
      POLARIS_USE_STS: "true"
      IN_CLUSTER: "{{ $IN_CLUSTER }}"
      ICECHUNK_BUCKET: "{{ $ICECHUNK_BUCKET }}"
      ICECHUNK_PREFIX: "{{ $ICECHUNK_PREFIX }}"
      PMTILES_BUCKET: "{{ $PMTILES_BUCKET }}"
      PMTILES_PREFIX: "{{ $PMTILES_PREFIX }}"
    node_selector:
      teehr-hub/nodegroup-name: spark-r5-4xlarge
    tolerations:
      - key: teehr-hub/dedicated
        operator: Equal
        value: worker
        effect: NoSchedule
      - key: teehr-hub_dedicated
        operator: Equal
        value: worker
        effect: NoSchedule
  work_pool_resources_standard: &work_pool_resources_standard
    cpu_request: "4"
    memory_request: 32Gi
  work_pool_resources_large: &work_pool_resources_large
    cpu_request: "8"
    memory_request: 64Gi
  work_pool: &work_pool
    name: kubernetes-pool
    job_variables:
      <<: [*work_pool_job_variables_base, *work_pool_resources_standard]
  work_pool_large: &work_pool_large
    name: kubernetes-pool
    job_variables:
      <<: [*work_pool_job_variables_base, *work_pool_resources_large]

# the deployments section allows you to provide configuration for deploying flows
deployments:
  # Workflows that are configured for the remote cluster
  - name: ingest-usgs-streamflow-obs
    version:
    tags: []
    concurrency_limit:
      limit: 1
      collision_strategy: "CANCEL_NEW"
    description: Ingest USGS streamflow data from NWIS
    entrypoint: workflows/ingests/usgs_streamflow_obs.py:ingest_usgs_streamflow_obs
    parameters: {"temp_dir_path": *temp_dir_path}
    work_pool: *work_pool
    schedule:
      cron: "0 8,20 * * *"
      active: false

  # NWM Short and Medium Range Ingests
  - name: ingest-nwm-short-range-streamflow-forecasts
    version:
    tags: []
    concurrency_limit:
      limit: 1
      collision_strategy: "CANCEL_NEW"
    description: Ingest NWM short range streamflow forecasts from GCS
    entrypoint: workflows/ingests/nwm_streamflow_forecasts.py:ingest_nwm_streamflow_forecasts
    parameters: {
      "temp_dir_path": *temp_dir_path,
      "nwm_configuration": "short_range"
    }
    work_pool: *work_pool
    schedule:
      cron: "0 7,19 * * *"
      active: false

  - name: ingest-nwm-medium-range-blend-streamflow-forecasts
    version:
    tags: []
    concurrency_limit:
      limit: 1
      collision_strategy: "CANCEL_NEW"
    description: Ingest NWM medium range blend streamflow forecasts from GCS
    entrypoint: workflows/ingests/nwm_streamflow_forecasts.py:ingest_nwm_streamflow_forecasts
    parameters: {
      "temp_dir_path": *temp_dir_path,
      "nwm_configuration": "medium_range_blend",
      "output_type": "channel_rt",
      "start_spark_cluster": false
    }
    work_pool: *work_pool
    schedule:
      cron: "10 6,18 * * *"
      active: false

  # RFC Ingest
  - name: ingest-nwps-rfc-streamflow-forecasts
    version:
    tags: []
    concurrency_limit:
      limit: 1
      collision_strategy: "CANCEL_NEW"
    description: Ingest NWPS RFC streamflow forecasts from NOAA servers
    entrypoint: workflows/ingests/nwps_rfc_streamflow_forecasts.py:ingest_nwps_rfc_forecasts
    parameters: {
      "temp_dir_path": *temp_dir_path
    }
    work_pool: *work_pool
    schedule:
      cron: "29 * * * *"
      active: false

  # Gridded Data Ingests
  - name: ingest-ua-4km-grids
    version:
    tags: []
    description: Ingest UA 4km SWE and DEPTH into an IceChunk S3 repository; upserts new, late and finalized days
    entrypoint: workflows/ingests/ingest_gridded_data.py:ingest_gridded_data
    parameters: {
      "args": {
        "source": {"type": "ua-swann-4km"},
        "fallback_source_crs": "EPSG:4269",
        "factors": [1],
        "write_mode": "upsert",
        "num_lookback_days": 30
      }
    }
    work_pool: *work_pool
    # Last 30 days: only new or changed days are downloaded
    schedule:
      cron: "0 14 * * *"
      active: false

  - name: ingest-isnobal
    version:
    tags: []
    description: Ingest iSnobal SWE GeoTIFFs for one domain into an IceChunk S3 repository using VirtualiZarr
    entrypoint: workflows/ingests/ingest_gridded_data.py:ingest_gridded_data
    parameters: {
      "args": {
        "source": {"type": "isnobal", "domain": "boise"},
        "parser_type": "tiff",
        "x_dim": "x",
        "y_dim": "y",
        "factors": [1, 2],
        "time_batch_size": 30,
        "ignore_unreadable_file": false
      }
    }
    work_pool: *work_pool

  # Gridded Pyramid Builds
  - name: build-ua-4km-grids-pyramids
    version:
    tags: []
    description: Build multiscale pyramids for the UA 4km SWE/DEPTH IceChunk repository
    entrypoint: workflows/ingests/build_geozarr_pyramids.py:build_pyramids
    parameters: {
      "args": {
        "configuration_name": "ua_swann_4km",
        "factors": [1]
      }
    }
    work_pool: *work_pool

  # Mean Areal Values
  - name: calculate-pixel-coverage-weights
    version:
    tags: []
    description: Calculate pixel coverage weights of location polygons on a gridded IceChunk repository
    entrypoint: workflows/ingests/pixel_coverage_weights.py:calculate_pixel_coverage_weights
    parameters: {
      "args": {
        "temp_dir_path": *temp_dir_path,
        "configuration_name": "ua_swann_4km",
        "location_id_prefix": "usgsbasin"
      }
    }
    work_pool: *work_pool

  - name: calculate-mean-areal-values
    version:
    tags: []
    description: Calculate mean areal values of location polygons from a gridded IceChunk repository
    entrypoint: workflows/ingests/mean_areal_values.py:calculate_mean_areal_values
    parameters: {
      "args": {
        "temp_dir_path": *temp_dir_path,
        "configuration_name": "ua_swann_4km",
        "location_id_prefix": "usgsbasin",
        "grid_variable_name": "swe_daily_inst"
      }
    }
    work_pool: *work_pool

  # Create Vector Tiles
  - name: create-vector-tiles
    version:
    tags: []
    description: Create vector tiles from the locations table and upload to S3
    entrypoint: workflows/data_management/create_vector_tiles.py:create_vector_tile_archive
    parameters: {
      "args": {
        "temp_dir_path": *temp_dir_path,
        "location_id_prefix": "usgsbasin",
        "output_layer_name": "usgs-basins"
      }
    }
    work_pool: *work_pool

  # Maintenance and Metrics Workflows
  - name: update-joined-forecast-table
    version:
    tags: []
    concurrency_limit:
      limit: 1
      collision_strategy: "CANCEL_NEW"
    description: Create the joined forecast timeseries table
    entrypoint: workflows/metrics/update_joined_forecasts.py:update_joined_forecast_table
    parameters: {"temp_dir_path": *temp_dir_path}
    work_pool: *work_pool_large
    # schedule:
    #   cron: "0 9,21 * * *"
    #   active: false

  - name: update-joined-forecast-table-incremental
    version:
    tags: []
    concurrency_limit:
      limit: 1
      collision_strategy: "CANCEL_NEW"
    description: Create the joined forecast timeseries table
    entrypoint: workflows/metrics/update_joined_forecasts.py:update_joined_forecast_table_incremental
    parameters: {"temp_dir_path": *temp_dir_path}
    work_pool: *work_pool
    schedule:
      cron: "0 9,21 * * *"
      active: false

  - name: update-forecast-metrics-table
    version:
    tags: []
    concurrency_limit:
      limit: 1
      collision_strategy: "CANCEL_NEW"
    description: Create the forecast metrics table
    entrypoint: workflows/metrics/update_forecast_metrics.py:update_forecast_metrics_table
    parameters: {"temp_dir_path": *temp_dir_path}
    work_pool: *work_pool_large
    schedule:
      cron: "0 10,22 * * *"
      active: false

  - name: routine-table-maintenance
    version:
    tags: []
    concurrency_limit:
      limit: 1
      collision_strategy: "CANCEL_NEW"
    description: Run routine Iceberg table maintenance (expire snapshots, remove orphan files, compact data files, rewrite manifests)
    entrypoint: workflows/maintenance/routine_table_maintenance.py:routine_table_maintenance
    parameters: {"temp_dir_path": *temp_dir_path}
    work_pool: *work_pool
    schedule:
      cron: "0 4 * * 0"
      active: false

  - name: cleanup-old-flow-runs
    version:
    tags: []
    concurrency_limit:
      limit: 1
      collision_strategy: "CANCEL_NEW"
    description: Delete old Prefect flow runs (status=COMPLETED, older than 7 days)
    entrypoint: workflows/maintenance/prefect_cleanup.py:rm_completed_flow_runs
    parameters: {"age_limit_days": 7}
    work_pool: *work_pool
    schedule:
      cron: "15 3 * * *"
      active: false

  - name: update-queryable-combinations
    version:
    tags: []
    concurrency_limit:
      limit: 1
      collision_strategy: "CANCEL_NEW"
    description: Precompute distinct group_by combinations that back the API queryable values endpoint
    entrypoint: workflows/data_management/update_queryable_combinations.py:update_queryable_combinations
    parameters: {"temp_dir_path": *temp_dir_path, "start_spark_cluster": false}
    work_pool: *work_pool
    schedule:
      cron: "0 5 * * *"
      active: true

  # RiverWare Windows EC2 Workflows
  - name: run-riverware-python-ssm-test
    version:
    tags: []
    concurrency_limit:
      limit: 1
      collision_strategy: "CANCEL_NEW"
    description: Run ssm_test.py on the RiverWare Windows EC2 instance via AWS SSM
    entrypoint: workflows/riverware/riverware_ssm_run.py:run_riverware_python_script
    parameters: {"script_path": 'C:\FVED\Scripts\ssm_test.py'}
    work_pool: *work_pool

  - name: run-riverware-s3-workflow
    version:
    tags: []
    concurrency_limit:
      limit: 1
      collision_strategy: "CANCEL_NEW"
    description: Prototype S3 data exchange - upload input to S3, run EC2 script via SSM, validate outputs
    entrypoint: workflows/riverware/riverware_s3_workflow.py:run_riverware_s3_workflow
    parameters:
      script_path: 'C:\FVED\teehr-fved\riverware\run_pipeline.py'
      model_dir: 'C:\FVED\Models\CRMMS-ESP\CRMMS_July2026'
      configuration_name: crmms_esp_july2026
    work_pool: *work_pool
